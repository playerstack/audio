name: ✨ Feature Request
description: Suggest a new feature for @playerstack/audio player.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion! Please describe it clearly so we can evaluate and prioritize.

  - type: textarea
    id: related-problem
    attributes:
      label: Related Problem
      description: Is this related to a problem? Describe what frustrates you.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Proposed Solution
      description: A clear description of the feature you'd like.
      placeholder: "Add a new prop/component that..."
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What area does this feature affect?
      options:
        - Audio Skin (UI/Controls)
        - Playback Engine
        - Streaming (HLS/DASH)
        - Chapters
        - Ads
        - Accessibility
        - Performance
        - API/Props
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any extra context, mockups, reference implementations, or code examples.
    validations:
      required: false
